  sanitizers:
    name: C sanitizers + valgrind (TODO #188)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang gcc libc6-dev python3 valgrind

      - name: Build C suite/tests/CLI under ASan+UBSan
        run: ./build_c_sanitize.sh

      - name: Security test suite under ASan+UBSan
        run: ./CryptosuiteTests/Herradura_tests_asan -t 2.0

      - name: CLI integration tests against the ASan+UBSan CLI
        run: |
          cp HerraduraCli/herradura_cli_asan HerraduraCli/herradura_cli
          # test_weak_key_rejection.sh is here as well as in native-c: it is the
          # malformed-PEM script, and TODO #239's cases (a QC-MDPC row weight
          # that overran a stack buffer, an unbounded ring k/rounds) are caught
          # by the sanitizer, not by an exit status in a plain build.
          for f in CliTest/test_c_*.sh CliTest/test_weak_key_rejection.sh; do
            echo "=== $f ==="
            bash "$f"
          done

      - name: Valgrind memcheck pass (plain debug build, tight bounds)
        run: |
          gcc -O0 -g -o /tmp/herr_tests_valgrind CryptosuiteTests/Herradura_tests.c
          valgrind --error-exitcode=99 --leak-check=full \
            --show-leak-kinds=definite,indirect \
            /tmp/herr_tests_valgrind -r 3 -t 0.2

  analysis-findings:
    name: SecurityProofsCode findings gates (TODO #289)
    runs-on: ubuntu-latest
    # BLOCKING since TODO #317 (v9.5.6). This job ran `continue-on-error: true`
    # from TODO #289 until then, on TODO #185's route for the `arduino` job:
    # promote once a pass history exists. Three things had to be true first,
    # and the last of them is why it took until now.
    #
    # (1) THE HISTORY. Seven consecutive green runs (v9.5.1 through v9.5.5 and
    #     both PR runs). The only two failures in that window are the v9.5.0
    #     runs, which were a REAL defect -- two analysis gates raising E_WIDTH
    #     on their first call after TODO #314's pass 4 changed the BitArray
    #     width contract -- found and fixed by TODO #315.
    #
    # (2) THE SAMPLING RISK THIS FLAG NAMED IS NOW MEASURED, not hoped about.
    #     The old comment here said the risk being watched was not build
    #     flakiness but SAMPLING, and that finding it out on a required check
    #     would be the wrong way round. That was right, and it is now answered:
    #     TODO #300 censused all 76 gates and put the job's nominal
    #     false-failure rate at 6.4e-5 per run, every sampled gate carrying a
    #     verdict code and a derived RATE or a stated ARGUMENT, with the two
    #     counted separately in the runner's banner. TODO #304 then audited the
    #     three `follows` entries and found all three defective, which is how
    #     the figure became 6.4e-5 rather than the 5.4e-5 it had advertised.
    #
    # (3) WHAT LEAVING IT COST, which is the argument for acting rather than
    #     waiting longer. TODO #315 found two gates that had been RED FOR TWO
    #     RELEASES, and the reason nobody noticed is this flag: a
    #     continue-on-error job's red is indistinguishable from nobody having
    #     looked -- TODO #289's own premise, inverted. A job that collects exit
    #     statuses nobody reads collects nothing.
    #
    # If a gate does flake from here, the fix is that gate's threshold and not
    # this flag -- the class CLAUDE.md's Testing section describes, a
    # probabilistic property asserted as a deterministic one -- and TODO #299's
    # replication is the pattern: confirm an exceedance against a second
    # independent sample before failing. Re-adding `continue-on-error` to get a
    # red run to pass is the move this comment exists to refuse.
    # Raised from 180 by TODO #291, which took the discovered set from 35
    # scripts to 73: measured 73.4 min before and about 120 min after, on an
    # aarch64 SBC that is an upper bound on a runner. The headroom is for the
    # heavy tail (five scripts are over five minutes each), not for a hang --
    # the runner has its own per-script timeout for that.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # highspy (the HiGHS LP solver, which pulls in numpy) backs
      # local_potential_certificate.py and local_certificate_n256.py (TODO
      # #257, sixth and seventh passes), whose bounds are LP optima, so it is
      # not optional either: absent, those gates exit non-zero on z3's
      # reasoning below.  The seventh pass also compiles a standalone C helper
      # with the runner's gcc, on exact_slope_ladder.py's precedent, and so
      # does the eighth (hull_exact.py / hull_exact.c, which needs no solver).
      # The ninth (live_region_certificate.py) needs both: it drives the fifth
      # pass's C solver and the seventh pass's LP.
      # The tenth (width_lift_closure.py) drives the fifth pass's C solver and
      # needs no solver; so does the eleventh (coupled_width_increment.py).
      #
      # z3-solver backs three of the gates below and is NOT optional here --
      # see the note on the runner step. Everything else in this job runs on a
      # bare python3. The install must FAIL the step rather than be skipped:
      # a missing solver is now a failing gate, by design, but one that fails
      # in the runner reads as "a finding stopped reproducing", which is the
      # wrong diagnosis. `--break-system-packages` is for an
      # externally-managed runner python3; the plain form is tried first so
      # this keeps working either way.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pip
          python3 -m pip install z3-solver highspy \
            || python3 -m pip install --break-system-packages z3-solver highspy
          python3 -c 'import z3; print("z3", z3.get_version_string())'
          python3 -c 'import highspy, numpy; print("highspy ok, numpy", numpy.__version__)'

      # TODO #289. About three dozen SecurityProofsCode/ scripts advertise
      # "exits non-zero if a finding stops reproducing". TODO #285 found that
      # NO job collected that status, and the three items that followed each
      # added ONE script to a step in native-python and excluded the rest on
      # runtime grounds -- twice leaving a script that was already failing
      # inside the excluded set (#286 found three broken gates, #288 six).
      # "Too slow for a step" was a real constraint and the wrong answer to
      # it: CI runs twelve jobs in parallel, so a job of its own costs runner
      # time and nothing on the critical path.
      #
      # The runner DISCOVERS its own set rather than reading a list -- see its
      # header. That is the half that stops this recurring: a list makes "we
      # did not get round to adding it" indistinguishable from "it passes",
      # which is precisely what happened three times. Excluding a script is
      # still possible and needs a reason in EXCLUDED, which is self-
      # invalidating like every other curated table in this repo.
      #
      # z3-solver IS INSTALLED, and the first run of this job is why (TODO
      # #290). The step above used to be a bare python3 on the stated ground
      # that the solver-backed scripts "skip with a printed NOTE" without
      # their solver. That is true of pulp/highspy in nl_fscx_v2_bounds.py
      # §(d) -- one section of a script that gates on other things -- and it
      # was FALSE of all three z3 consumers: fscx_periodicity_z3.py and
      # hpks_schnorr_z3.py are z3 from top to bottom and died on a
      # module-level `import z3` (ModuleNotFoundError, exit 1, 0 s), and
      # nl_fscx_exact_trail_search.py returned 2 with a one-line message. So
      # the job's first run reported three gates "stopped reproducing" when
      # nothing had stopped reproducing, and the two pure-z3 gates had no
      # content left to gate on anyway. 18 s and 47 s respectively, plus the
      # trail search -- a bounded cost against two SMT proofs about the
      # deployed GF arithmetic and FSCX period structure.
      #
      # pulp stays OUT: nl_fscx_v2_bounds.py §(d) genuinely is one section
      # of a script that gates without it, and the bounds it computes are
      # recorded in SecurityProofs-*.md rather than asserted about shipped
      # code.  highspy was out for the same reason until TODO #257's sixth
      # pass made it the whole of a gate.  Installing it does NOT reach §(d):
      # that script finds HiGHS only through pulp, which is still absent.
      #
      # The local counterpart of this decision is in the three scripts: a
      # missing z3 now prints what to install and exits NON-ZERO rather than
      # tracebacking or passing vacuously. A gate whose subject is absent has
      # not reproduced its finding.
      #
      # WHAT THIS JOB COVERS SINCE TODO #291: every .py in SecurityProofsCode/,
      # because that item asked the prior question -- which scripts GATE -- and
      # found 46 of 81 that did not, 22 of them computing a PASS/FAIL verdict
      # and discarding it. It is 73 gating and 7 declared non-gating now, and
      # the runner FAILS on a script that is neither, so a new analysis script
      # cannot quietly join the uncovered set.
      - name: Every findings gate still reproduces
        run: python3 SecurityProofsCode/run_findings_gates.py --quick

  docker:
    name: Docker quickstart (image + entrypoint smoke run)
    runs-on: ubuntu-latest
    # TODO #326. Dockerfile and docker-entrypoint.sh were a DOCUMENTED entry
    # point -- README.md and CLAUDE.md both send a new user to
    # `docker build -t herradurakex .` -- that NO job built or ran, for 437
    # commits. That is #324's hello_herradura.c shape: the path a newcomer takes
    # first, exercised by nothing, and that file aborted on its first call.
    #
    # Both halves were measured BEFORE this job was written, and both passed --
    # the image builds and the entrypoint exits 0 with five harnesses green --
    # so this is coverage, not a repair. The split below is the whole design:
    #
    #   the IMAGE BUILD is what catches dependency rot (a base-image or apt
    #   package name moving), and is cheap on a native-amd64 runner;
    #
    #   the ENTRYPOINT runs end-to-end at REDUCED CAPS, because the twelve other
    #   jobs already run every one of its targets at FULL size. What is unproven
    #   in the container is the SCRIPT, not the cryptography -- and a full run is
    #   ~75-90 min on an ARM SBC, which would make this the slowest job in the
    #   matrix and re-create #289's recorded runtime problem on purpose.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3

      # Runs before the build: it is a source check, so it should fail in
      # seconds rather than after an image build.
      - name: Mirror guard — docker-entrypoint.sh vs ci.yml
        run: python3 tools/check_docker_mirror.py

      # TODO #328. Go's fmtRate had two branches where C's print_rate and Python's
      # _bench have three, so every rate below 1e6 printed in K units and the
      # harness's six slowest benchmarks published "0.00 K ops/sec" for true rates
      # of 0.36-8.57 ops/sec -- false, not imprecise. Nothing caught it because NO
      # checker parses benchmark output, and this does not change that (running
      # benchmarks in CI is #289's runtime problem, and a cost figure is
      # host-specific). It holds the three formatters against each other
      # STATICALLY instead: same thresholds, same branches, read from source.
      - name: Rate-formatter parity — C / Go / Python
        run: python3 tools/check_rate_format.py

      - name: Build the quickstart image
        run: docker build -t herradurakex:ci .

      # The caps are env vars whose DEFAULTS are the shipped behaviour, so a
      # user's `docker run` is byte-identical to before TODO #326.
      - name: Entrypoint smoke run (reduced caps)
        run: |
          docker run --rm \
            -e HERRADURA_SMOKE_ROUNDS=2 \
            -e HERRADURA_SMOKE_TIME=0.05 \
            herradurakex:ci

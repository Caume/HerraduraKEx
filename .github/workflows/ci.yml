name: CI

# TODO #153: build/test matrix mirroring docker-entrypoint.sh's smoke run and
# CLAUDE.md's Build/Testing sections. Intentionally does not duplicate build
# logic: every job installs the dependencies each build_*.sh script's own
# header comments document, then defers to those scripts for the rest, so CI
# and the scripts can't silently drift apart (same rationale as the Dockerfile).

on:
  push:
    branches: [master, devtest]
  pull_request:
    branches: [master, devtest]
  workflow_dispatch:

jobs:
  # TODO #205: split from a single combined C/Go/Python job into one job per
  # language, so a failure in one language doesn't block visibility into the
  # others and each can be inspected/re-run independently. CliTest/*.sh
  # scripts are split by which language(s)' CLI binaries they touch: the
  # single-`c_`/`go_`-prefixed and untagged (Python-only) scripts run in
  # their matching job; scripts that exercise two or more CLIs run in
  # native-interop, which is the only job that builds both C and Go.
  native-c:
    name: C (build + tests + CliTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Build C
        run: ./build_c.sh

      # TODO #258/#259. build_c.sh compiles the suite demo binary but nothing ran
      # it -- only the separate Herradura_tests_c harness was gated. The demo is
      # a different binary with its own bugs: a segfault in the HCRED section
      # went unnoticed through every green run because of that gap (#258). This
      # step now gates on both a crash AND a wrong verdict: the demo's own
      # "+"/"-" narrative prefix is ambiguous (it marks both genuine failures
      # and, in the Eve bypass sections, a correct negative result), so every
      # genuine-failure branch was rewritten to also carry an explicit
      # "[FAIL]" marker, scanned exactly as Herradura_tests_c scans its own
      # (TODO #233), and the demo now exits non-zero if any fires (#259).
      - name: C suite demo runs to completion
        run: ./"Herradura cryptographic suite_c"

      - name: C test suite
        run: ./CryptosuiteTests/Herradura_tests_c -t 2.0

      - name: CliTest — C CLI
        run: |
          for f in CliTest/test_c_*.sh CliTest/test_weak_key_rejection.sh; do
            case "$(basename "$f")" in test_c_interop.sh) continue ;; esac
            echo "=== $f ==="
            bash "$f"
          done

  native-go:
    name: Go (build + tests + CliTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends golang-go

      - name: Build Go
        run: ./build_go.sh

      # TODO #258/#259. See the matching C step: gates on a crash AND a wrong
      # verdict, via the demo's own "[FAIL]"-marker exit code.
      - name: Go suite demo runs to completion
        run: ./"Herradura cryptographic suite_go"

      - name: Go test suite
        run: cd CryptosuiteTests && go run Herradura_tests.go -t 2.0

      - name: CliTest — Go CLI
        run: |
          for f in CliTest/test_go_*.sh; do
            case "$(basename "$f")" in test_go_interop.sh) continue ;; esac
            echo "=== $f ==="
            bash "$f"
          done

  native-python:
    name: Python (tests + CliTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # python3-jsonschema is for the spec gate below and nothing else -- the
          # suite and its CLI have no runtime dependencies. The gate passes
          # --require-schema, so if this install ever stops providing the package
          # the job fails rather than skipping the validation silently.
          sudo apt-get install -y --no-install-recommends python3 python3-jsonschema

      # TODO #258/#259. See the matching C step: gates on a crash AND a wrong
      # verdict, via the demo's own "[FAIL]"-marker exit code.
      - name: Python suite demo runs to completion
        run: python3 "Herradura cryptographic suite.py"

      - name: Python test suite
        run: python3 CryptosuiteTests/Herradura_tests.py -t 2.0

      # TODO #238. spec/generate_spec.py had a --check mode from the start and no
      # job ever ran it, so nothing verified that the shipped JSON matched its
      # generator. check_security_md.py is the second half: --check validates the
      # spec against its sources, this validates its security classifications
      # against SECURITY.md's prose table — the disagreement-between-documents
      # class that TODO #237 found three instances of and neither tool could see.
      - name: spec/ is current with its generator, its schema, and SECURITY.md
        run: |
          python3 spec/generate_spec.py --check --require-schema
          python3 spec/check_security_md.py

      - name: CliTest — Python CLI
        run: |
          for f in CliTest/test_cred.sh CliTest/test_encfile.sh CliTest/test_encrypt.sh \
                   CliTest/test_encrypted_pem.sh CliTest/test_hybrid_kex.sh CliTest/test_keygen.sh \
                   CliTest/test_oprf.sh CliTest/test_pake.sh CliTest/test_rnl_sp800227_kdf.sh \
                   CliTest/test_sign.sh CliTest/test_signfile.sh CliTest/test_threshold_sign.sh \
                   CliTest/test_vectors.sh CliTest/test_zkp_nl.sh CliTest/test_zkp_rnl.sh; do
            echo "=== $f ==="
            bash "$f"
          done

  native-interop:
    name: C / Go / Python cross-CLI interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev golang-go python3

      - name: Build C
        run: ./build_c.sh

      - name: Build Go
        run: ./build_go.sh

      - name: CliTest — cross-language interop (C + Go + Python)
        run: |
          for f in CliTest/test_aead.sh CliTest/test_c_interop.sh CliTest/test_go_interop.sh \
                   CliTest/test_cred_interop.sh CliTest/test_oprf_interop.sh CliTest/test_stern_interop.sh \
                   CliTest/test_zkp_interop.sh CliTest/test_hybrid_kex_interop.sh CliTest/test_threshold_interop.sh \
                   CliTest/test_fuzz_interop.sh CliTest/test_kat_vectors.sh CliTest/test_duplex.sh \
                   CliTest/test_rand.sh CliTest/test_ring.sh CliTest/test_stern_kem.sh CliTest/test_wots.sh \
                   CliTest/test_zkbpp.sh CliTest/test_zkp_default_rounds.sh \
                   CliTest/test_kat_pem.sh CliTest/test_fpe_twk.sh \
                   CliTest/test_v3_family.sh; do
            echo "=== $f ==="
            bash "$f"
          done

      - name: Coverage guard — every non-Java CliTest/*.sh must be claimed by exactly one native-* job
        run: |
          declared="test_c_*.sh test_weak_key_rejection.sh \
                    test_go_*.sh \
                    test_cred.sh test_encfile.sh test_encrypt.sh test_encrypted_pem.sh test_hybrid_kex.sh \
                    test_keygen.sh test_oprf.sh test_pake.sh test_rnl_sp800227_kdf.sh test_sign.sh \
                    test_signfile.sh test_threshold_sign.sh test_vectors.sh test_zkp_nl.sh test_zkp_rnl.sh \
                    test_aead.sh test_c_interop.sh test_go_interop.sh test_cred_interop.sh test_oprf_interop.sh \
                    test_stern_interop.sh test_zkp_interop.sh test_hybrid_kex_interop.sh test_threshold_interop.sh \
                    test_fuzz_interop.sh test_kat_vectors.sh test_duplex.sh test_rand.sh test_ring.sh \
                    test_stern_kem.sh test_wots.sh test_zkbpp.sh test_zkp_default_rounds.sh \
                    test_kat_pem.sh test_fpe_twk.sh test_v3_family.sh"
          cd CliTest
          missing=0
          for f in *.sh; do
            case "$f" in test_java_*) continue ;; esac
            case "$f" in test_cross_lang_matrix.sh) continue ;; esac  # claimed by cross-lang-compat (TODO #207)
            case "$f" in test_malformed_pem_matrix.sh) continue ;; esac # claimed by cross-lang-compat (TODO #240)
            case "$f" in lib_*.sh) continue ;; esac                   # sourced helpers, not runnable tests (TODO #221)
            claimed=0
            for pattern in $declared; do
              case "$f" in $pattern) claimed=1 ;; esac
            done
            if [ "$claimed" -eq 0 ]; then
              echo "UNCLAIMED: $f is not run by any native-* CI job — update .github/workflows/ci.yml (TODO #205)"
              missing=1
            fi
          done
          exit $missing

      - name: Skip guard — a missing CLI binary must never exit 0
        run: |
          # TODO #229. The compiled CLIs are no longer tracked in git, so the
          # not-built guards in these scripts are live for the first time. Five
          # scripts carried the same copy-pasted block:
          #
          #     echo "SKIP: $bin not built (run build_c.sh / build_go.sh)"; exit 0
          #
          # which reports success from a run that asserted nothing. CI never saw
          # it (every job builds first), so it was a silent local coverage loss.
          # The replacement lives in CliTest/lib_build.sh and exits 2. This guard
          # stops the block from being pasted back in.
          cd CliTest
          missing=0
          for f in *.sh; do
            if grep -qF 'not built (run build_c.sh' "$f"; then
              echo "UNSAFE SKIP: $f exits 0 on a missing CLI binary — use lib_build.sh's" \
                   "hkx_require_built / hkx_require_asserted instead (TODO #229)"
              missing=1
            fi
          done
          exit $missing

      - name: DFR guard — every CliTest script that decapsulates must carry the retry policy
        run: |
          # TODO #221. The QC-MDPC BGF decoder behind hpke-stern-kem (and the KEM
          # half of hybrid-rnl-stern) has a measured ~0.225% decoding failure rate
          # per encapsulation, so any script that decapsulates will go red at that
          # rate unless it retries. TODO #195 established the retry policy but it
          # was applied per-script; test_stern_kem.sh (9 encapsulations, ~2%/run)
          # and test_hybrid_kex.sh went years without it. This guard stops the next
          # one from slipping through.
          cd CliTest
          missing=0
          for f in *.sh; do
            case "$f" in lib_dfr.sh) continue ;; esac
            # A script is exposed if it decapsulates: `dec --algo hpke-stern-kem`
            # or a hybrid-rnl-stern completion (the step that takes --our-kem).
            if grep -qE 'dec --algo hpke-stern-kem|--our-kem' "$f"; then
              if ! grep -q 'lib_dfr.sh' "$f"; then
                echo "UNGUARDED: $f decapsulates hpke-stern-kem but does not source lib_dfr.sh (TODO #221)"
                missing=1
              fi
            fi
            # TODO #235 deleted dfr_is_event: implicit rejection means a DFR
            # event no longer produces an error message, so a script grepping
            # for one would treat every DFR event as a hard red — the exact
            # failure this guard exists to prevent. Catch a resurrected copy.
            if grep -q 'dfr_is_event' "$f"; then
              echo "STALE: $f uses dfr_is_event, removed by TODO #235 — retry on an output mismatch via dfr_retryable instead"
              missing=1
            fi
          done
          exit $missing

  native-java:
    name: Java (build + CliTest interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jdk-headless python3

      - name: CliTest — Java bindings + interop
        run: |
          for f in CliTest/test_java_bindings.sh CliTest/test_java_codec.sh \
                   CliTest/test_java_keygen.sh CliTest/test_java_interop.sh \
                   CliTest/test_java_nl_interop.sh CliTest/test_java_stern_interop.sh \
                   CliTest/test_java_oprf_wots_interop.sh CliTest/test_java_hcred_interop.sh \
                   CliTest/test_java_pake_interop.sh; do
            echo "=== $f ==="
            bash "$f"
          done

  # TODO #207: independent of the four native-* build/test jobs above —
  # those prove each language's own suite/CLI passes its own tests; this
  # proves the cryptographic algorithms themselves interoperate correctly
  # *among* all four language CLIs (not just each against Python).
  cross-lang-compat:
    name: 4-language (C/Go/Python/Java) crypto compatibility matrix
    needs: [native-c, native-go, native-python, native-java]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev golang-go python3 default-jdk-headless

      - name: Build C
        run: ./build_c.sh

      - name: Build Go
        run: ./build_go.sh

      - name: Cross-language compatibility matrix
        run: bash CliTest/test_cross_lang_matrix.sh

      # TODO #240: the bounds on the PEM fields that size an allocation are a
      # wire contract, so they belong in the 4-way job rather than any single
      # language's. An artifact one CLI refuses must not be one another accepts.
      - name: Malformed-PEM rejection matrix
        run: bash CliTest/test_malformed_pem_matrix.sh

  arm-i386:
    name: ARM Thumb-2 / NASM i386 (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabi libc6-dev-armel-cross \
            nasm binutils-x86-64-linux-gnu \
            qemu-user

      - name: Build ARM Thumb-2
        run: ./build_arm.sh

      - name: Build NASM i386
        run: ./build_asm_i386.sh

      - name: ARM Thumb-2 test suite (qemu-arm)
        run: ./run_arm.sh tests

      - name: NASM i386 test suite (qemu-i386)
        run: ./run_asm_i386.sh tests

  katex:
    name: KaTeX math rendering validation (TODO #179)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install katex
        run: npm install katex --no-save

      - name: Validate math spans in README.md and SecurityProofs*.md
        run: |
          fail=0
          for f in README.md SecurityProofs.md SecurityProofs-[0-9]*.md; do
            echo "=== $f ==="
            node SecurityProofsCode/validate_katex.js "$f" || fail=1
          done
          exit $fail

      - name: Part-index consistency (TODO #231)
        run: python3 SecurityProofsCode/check_part_index.py --require-counts

  arduino:
    name: Arduino / AVR (build + simavr tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc arduino-core simavr

      - name: Build Arduino/AVR
        run: ./build_arduino.sh

      - name: Arduino test suite (simavr)
        run: ./run_arduino.sh tests

  fuzz-smoke:
    name: Fuzz smoke test (TODO #187)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang gcc libc6-dev golang-go python3 python3-hypothesis

      - name: Build C and Go CLIs (needed by the CLI-argv fuzz target)
        run: |
          ./build_c.sh
          ./build_go.sh

      - name: Run fuzz harness (30s/target smoke budget)
        run: ./Fuzz/run_fuzz.sh 30

  sanitizers:
    name: C sanitizers + valgrind (TODO #188)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang gcc libc6-dev python3 valgrind

      - name: Build C suite/tests/CLI under ASan+UBSan
        run: ./build_c_sanitize.sh

      - name: Security test suite under ASan+UBSan
        run: ./CryptosuiteTests/Herradura_tests_asan -t 2.0

      - name: CLI integration tests against the ASan+UBSan CLI
        run: |
          cp HerraduraCli/herradura_cli_asan HerraduraCli/herradura_cli
          # test_weak_key_rejection.sh is here as well as in native-c: it is the
          # malformed-PEM script, and TODO #239's cases (a QC-MDPC row weight
          # that overran a stack buffer, an unbounded ring k/rounds) are caught
          # by the sanitizer, not by an exit status in a plain build.
          for f in CliTest/test_c_*.sh CliTest/test_weak_key_rejection.sh; do
            echo "=== $f ==="
            bash "$f"
          done

      - name: Valgrind memcheck pass (plain debug build, tight bounds)
        run: |
          gcc -O0 -g -o /tmp/herr_tests_valgrind CryptosuiteTests/Herradura_tests.c
          valgrind --error-exitcode=99 --leak-check=full \
            --show-leak-kinds=definite,indirect \
            /tmp/herr_tests_valgrind -r 3 -t 0.2

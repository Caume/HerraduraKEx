name: CI

# TODO #153: build/test matrix mirroring docker-entrypoint.sh's smoke run and
# CLAUDE.md's Build/Testing sections. Intentionally does not duplicate build
# logic: every job installs the dependencies each build_*.sh script's own
# header comments document, then defers to those scripts for the rest, so CI
# and the scripts can't silently drift apart (same rationale as the Dockerfile).
#
# TODO #326: that last clause is now CHECKED, by tools/check_docker_mirror.py in
# the `docker` job below. It was asserted by nobody for 437 commits and it HAD
# drifted -- a complete Java port shipped at #196-#203 and became a REQUIRED job
# while the Dockerfile went on advertising a language count it did not build,
# naming neither Java nor a reason. A sentence promising two things cannot drift
# apart is #287's withdrawn trust-model sentence unless something compares them.

on:
  push:
    branches: [master, devtest]
  pull_request:
    branches: [master, devtest]
  workflow_dispatch:

jobs:
  # TODO #205: split from a single combined C/Go/Python job into one job per
  # language, so a failure in one language doesn't block visibility into the
  # others and each can be inspected/re-run independently. CliTest/*.sh
  # scripts are split by which language(s)' CLI binaries they touch: the
  # single-`c_`/`go_`-prefixed and untagged (Python-only) scripts run in
  # their matching job; scripts that exercise two or more CLIs run in
  # native-interop, which is the only job that builds both C and Go.
  native-c:
    name: C (build + tests + CliTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - name: Build C
        run: ./build_c.sh

      # TODO #258/#259. build_c.sh compiles the suite demo binary but nothing ran
      # it -- only the separate Herradura_tests_c harness was gated. The demo is
      # a different binary with its own bugs: a segfault in the HCRED section
      # went unnoticed through every green run because of that gap (#258). This
      # step now gates on both a crash AND a wrong verdict: the demo's own
      # "+"/"-" narrative prefix is ambiguous (it marks both genuine failures
      # and, in the Eve bypass sections, a correct negative result), so every
      # genuine-failure branch was rewritten to also carry an explicit
      # "[FAIL]" marker, scanned exactly as Herradura_tests_c scans its own
      # (TODO #233), and the demo now exits non-zero if any fires (#259).
      - name: C suite demo runs to completion
        run: ./"Herradura cryptographic suite_c"

      - name: C test suite
        run: ./CryptosuiteTests/Herradura_tests_c -t 2.0

      # TODO #324. The poisoned build was introduced by #314 pass 2 and widened
      # by #315, which wrote that "the whole C tree is poison-built and RUN now"
      # -- describing a MANUAL invocation that left no artifact, so it could not
      # be re-run and did not cover a file added later. The tree has TEN
      # translation units including herradura.h and that sweep covered seven;
      # all three it missed carried the defect, and bindings/ffi/herradura_shim.c
      # stack-smashed on every call for seventeen releases (v9.1.0..v9.5.12).
      # The set is DISCOVERED here, not listed, so a new TU with no driver is an
      # error rather than a silence.
      - name: Poisoned build — every C TU including herradura.h, built and run
        run: bash tools/poison_build.sh

      # TODO #324. This harness existed, failed, and NO job ran it: #287's
      # coverage guard globs bindings/ffi/test_*.py, one directory too shallow,
      # so it matched nothing -- and a glob that matches nothing is
      # indistinguishable from a glob that is satisfied. The guard below is
      # recursive now; this step is what it guards.
      - name: FFI correctness (Python ctypes vs native C)
        run: |
          bash bindings/ffi/build.sh
          python3 bindings/ffi/python/test_ffi_correctness.py

      # TODO #329. docs/examples/ and benchmarks/ hold 15 shipped executables and
      # 11 had no runner at all. Two of these were already broken: rnl_ring_cost.py
      # exited 1 with E_WIDTH: 512 from v9.3.0 (#314 pass 4's width rule, the same
      # defect #315 found in two SecurityProofsCode gates at that commit), and the
      # three FFI-consuming compare_*.py aborted with rc=134 against the shim #324
      # fixed. The coverage that existed was ACCIDENTAL -- three C files are
      # discovered by poison_build.sh above because they include herradura.h.
      #
      # These two live here because they need the C CLI and herradura.h
      # respectively: compare_stern_f_dilithium.py drives HerraduraCli/herradura_cli
      # and exits non-zero if it is not built, and v3_round_cost.c is the one C
      # benchmark poison_build.sh does NOT discover -- it carries its own packed
      # representation and includes no herradura.h, so nothing compiled it.
      # liboqs is absent on the runner and the script degrades to the Herradura
      # half with a NOTE, which is the half that matters here.
      - name: Benchmarks that need the C toolchain (docs/examples + benchmarks)
        run: |
          gcc -O2 -o /tmp/v3_round_cost benchmarks/v3_round_cost.c -lm
          /tmp/v3_round_cost > /dev/null
          echo "=== benchmarks/v3_round_cost.c built and ran ==="
          python3 benchmarks/compare_stern_f_dilithium.py

      - name: CliTest — C CLI
        run: |
          for f in CliTest/test_c_*.sh CliTest/test_weak_key_rejection.sh; do
            case "$(basename "$f")" in test_c_interop.sh) continue ;; esac
            echo "=== $f ==="
            bash "$f"
          done

  native-go:
    name: Go (build + tests + CliTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # TODO #325 added gcc/libc6-dev: the FFI step below builds the shared
          # object and cgo needs a C compiler. The runner image ships one, but
          # every other job here names what it uses rather than inheriting it.
          sudo apt-get install -y --no-install-recommends golang-go gcc libc6-dev

      - name: Build Go
        run: ./build_go.sh

      # TODO #258/#259. See the matching C step: gates on a crash AND a wrong
      # verdict, via the demo's own "[FAIL]"-marker exit code.
      - name: Go suite demo runs to completion
        run: ./"Herradura cryptographic suite_go"

      - name: Go test suite
        run: cd CryptosuiteTests && go run Herradura_tests.go -t 2.0

      # TODO #325. These two files existed and NO job ran them: there was no
      # `go test` invocation in this workflow at all, and the only one in the
      # repo is Fuzz/run_fuzz.sh's `go test ./herradura/ -run=xxx -fuzz=...`,
      # where -run=xxx deliberately excludes ordinary tests. Rebuilt against the
      # shim that shipped from v9.1.0 to v9.5.12 they HARD-CRASH, so they would
      # have caught TODO #324 on their first run -- and they were last edited at
      # v9.2.0, one release after that defect landed. -count=1 because a cached
      # PASS from a previous shim is exactly the failure mode being closed here:
      # the .so is not a Go source file, so the test cache does not see it move.
      - name: FFI correctness (Go cgo vs native Go suite)
        run: |
          bash bindings/ffi/build.sh
          # The two files are NAMED rather than left to ./... for two reasons:
          # the coverage guard below matches a harness by path, so a step that
          # only says ./... claims nothing; and a rename or deletion then fails
          # HERE, loudly, instead of silently reducing what this step runs.
          for f in bindings/ffi/go/herradura_ffi_test.go \
                   bindings/ffi/go/herradura_ffi_native_test.go; do
            test -f "$f" || { echo "MISSING: $f (TODO #325)"; exit 1; }
          done
          cd bindings/ffi/go && go test -count=1 ./...

      # TODO #329. The Go integration example and the Go deployed-ring benchmark
      # are the two consumers of the herradura package that no job built -- of 8
      # in-tree consumers, 6 had runners. The example is the sharper case: it
      # dot-imports the package, and #314 pass 3 unexported Val and changed
      # GfMul/GfPow/GfPoly. It WAS edited in that commit, i.e. fixed blind; the
      # pre-pass-3 version against today's package fails with 7 compile errors
      # (undefined: GfPoly, alicePriv.Val undefined, too many arguments in call
      # to GfPow). Its C sibling in the same directory ABORTED on its first call
      # for 437 commits until #324 ran it.
      #
      # The deployed-ring benchmark is BUILD-ONLY, deliberately: #292 excluded
      # these from CI because host-specific cost figures do not belong here, which
      # is right about the NUMBERS and silent about whether the file still
      # COMPILES (#310's "a reason exact about the wrong object"). Building it
      # asserts nothing about a rate, so #292's position is not reversed.
      #
      # compare_fscx_revolve_closed_form.py runs here because it wants gcc AND go
      # and this job has both; it now treats a failed build as an ERROR rather
      # than printing "skipped (build failed)" and exiting 0.
      - name: Examples and benchmarks that need the Go toolchain
        run: |
          go run docs/examples/go/hello_herradura.go
          go build -o /tmp/rnl_deployed_ring_cost_go benchmarks/rnl_deployed_ring_cost.go
          echo "=== benchmarks/rnl_deployed_ring_cost.go builds ==="
          python3 benchmarks/compare_fscx_revolve_closed_form.py

      - name: CliTest — Go CLI
        run: |
          for f in CliTest/test_go_*.sh; do
            case "$(basename "$f")" in test_go_interop.sh) continue ;; esac
            echo "=== $f ==="
            bash "$f"
          done

  native-python:
    name: Python (tests + CliTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # python3-jsonschema is for the spec gate below and nothing else -- the
          # suite and its CLI have no runtime dependencies. The gate passes
          # --require-schema, so if this install ever stops providing the package
          # the job fails rather than skipping the validation silently.
          # gcc/libc6-dev are for TODO #329's FFI-consuming benchmarks below,
          # which need bindings/ffi/build.sh. Named rather than inherited from
          # the runner image, on #325's precedent in the Go job.
          sudo apt-get install -y --no-install-recommends python3 python3-jsonschema gcc libc6-dev

      # TODO #258/#259. See the matching C step: gates on a crash AND a wrong
      # verdict, via the demo's own "[FAIL]"-marker exit code.
      - name: Python suite demo runs to completion
        run: python3 "Herradura cryptographic suite.py"

      - name: Python test suite
        run: python3 CryptosuiteTests/Herradura_tests.py -t 2.0

      # TODO #329. The Python integration example and four benchmarks, none of
      # which any job ran. docs/examples/python/hello_herradura.py is what
      # docs/TUTORIAL.md points a new user at, and its C sibling in the same
      # directory aborted on its first call for 437 commits until #324.
      #
      # The three compare_*.py here import bindings/ffi/python/herradura_ffi.py,
      # so they are consumers of the shim whose nbits was never set: against the
      # shim that shipped v9.1.0..v9.5.12 a single hkex_gf_pubkey call aborts,
      # measured rc=134 "E_WIDTH in ba_nbytes". #324's record says it "was found
      # by trying to run a benchmark" -- one of these three is how, by hand.
      # libsodium is absent on the runner and all three degrade to the Herradura
      # half with a NOTE (verified), which is the half that exercises the shim.
      #
      # rnl_ring_cost.py is the repair in this item: it exited 1 with
      # `ValueError: E_WIDTH: 512` from v9.3.0 to v9.5.17 because it passed the
      # ring dimension as the session-key width too. --quick runs the whole of
      # 1 -- every dimension INCLUDING 1024, so the 5.2x claim #223 quotes
      # stays checked, and the per-dimension reconciliation control is asserted
      # at each -- and skips 2/3, which are #225's cap audit and deliberately
      # enter sites slower than the cap: a full run measured >600 s here even at
      # --max-n 256, which is #289's runtime problem. --quick is 0.6 s.
      - name: Examples and benchmarks (TODO #329's census)
        run: |
          python3 docs/examples/python/hello_herradura.py
          bash bindings/ffi/build.sh
          python3 benchmarks/compare_hkex_x25519.py
          python3 benchmarks/compare_hpks_ed25519.py
          python3 benchmarks/compare_hske_aead.py
          python3 benchmarks/rnl_ring_cost.py --quick
          python3 benchmarks/rnl_deployed_ring_cost.py

      # TODO #238. spec/generate_spec.py had a --check mode from the start and no
      # job ever ran it, so nothing verified that the shipped JSON matched its
      # generator. check_security_md.py is the second half: --check validates the
      # spec against its sources, this validates its security classifications
      # against SECURITY.md's prose table — the disagreement-between-documents
      # class that TODO #237 found three instances of and neither tool could see.
      - name: spec/ is current with its generator, its schema, and SECURITY.md
        run: |
          python3 spec/generate_spec.py --check --require-schema
          python3 spec/check_security_md.py

      # TODO #261's mechanism half, and since v6.1.0 the whole of it:
      # numbered-test contiguity/alignment across C/Go/Python/Java, a
      # suite-internal (non-CLI) primitive manifest of 196 entries with four
      # cells each, and the INTERNAL-SURFACE CENSUS that keeps the manifest
      # complete — it enumerates each language's suite functions, subtracts the
      # ones that language's CLI calls and the ones the manifest names, and
      # fails on the rest. That is what makes "no silent absence" a check
      # rather than a habit: a new suite-internal primitive in ANY of the four
      # languages fails this step until it is filed or exempted with a reason.
      # Only reads source text (no build needed), so it runs here regardless of
      # which other jobs pass.
      - name: cross-language parity (numbered tests + suite-internal primitives + census)
        run: python3 spec/check_language_parity.py

      # TODO #265. The third axis: the two checks above compare spec/ against
      # SECURITY.md and against the four language ports, but nothing looked at
      # the NARRATIVE documents. README.md, docs/INTRODUCTION.md and CHANGELOG.md
      # restate the same protocols, parameters and maturity verdicts as spec/ and
      # herradura.h, in hand-written prose, and could drift freely. Six defects on
      # the first run, including a README that called the demo Stern round count a
      # production default and told readers to ignore a blocking CI gate.
      - name: cross-document consistency (README / INTRODUCTION / CHANGELOG vs. sources)
        run: python3 spec/check_docs_consistency.py

      # TODO #285. About 34 of the SecurityProofsCode/ scripts advertise "exits
      # non-zero if a finding stops reproducing" and until now NO job collected
      # that status, so the promise was untested. That is how
      # qcmdpc_dfr_weak_keys.py -- the recorded acceptance oracle for both TODO
      # #218 and TODO #235 -- came to exit 1 in its own first section for two
      # releases after #276 moved the QC-MDPC parameters out from under it,
      # with nothing anywhere noticing.
      #
      # THE RULE FOR THIS STEP CHANGED IN TODO #289, and the old one is worth
      # recording because it caused the damage: it read "add a script here only
      # when its --quick runtime is minutes, not tens of minutes", and three
      # items in a row duly added one script and excluded the rest -- twice
      # leaving a script that was ALREADY FAILING inside the excluded set. The
      # whole corpus now runs in the `analysis-findings` job at the bottom of
      # this file, which discovers its own set instead of reading a list.
      #
      # These two stay HERE as well, and the duplication is deliberate: they are
      # the two QC-MDPC gates that #285 and #286 found broken, they are the ones
      # that cover the parameters a deployed KEM rests on. This used to add
      # "native-python is a REQUIRED job where analysis-findings is still on
      # probation"; TODO #317 made analysis-findings blocking, so the duplication
      # is now defense in depth rather than the only required coverage (TODO
      # #336): a QC-MDPC regression fails the language job it touches, not only
      # the 2-hour findings job. ~4.5 min of a job that already runs longer than
      # that. Do not add a third script here -- the new job takes it
      # automatically.
      #
      # TODO #286 added the second one, and the reason is the argument for this
      # step existing at all: qcmdpc_parameter_selection.py was ALREADY FAILING
      # when #285 wired up the first, three gates at once, and covering only one
      # script meant nothing saw it. It is the script that chose the deployed
      # QC-MDPC parameters, and it broke because #276's recommendation was
      # ADOPTED -- its before/after comparisons read "before" from the suite, so
      # adoption collapsed them onto one instance. ~58 s under --quick.
      - name: SecurityProofsCode — QC-MDPC findings still reproduce
        run: |
          python3 SecurityProofsCode/qcmdpc_dfr_weak_keys.py --quick
          python3 SecurityProofsCode/qcmdpc_parameter_selection.py --quick

      # TODO #287. Mcp/ exposes the CLI as eight agent-callable tools over stdio,
      # and Mcp/test_server.py is a correctly built harness -- 11 checks, exits 1
      # on any failure, 3 s -- that NO job ran. Its reach matters more than its
      # size: Mcp/README.md's trust model tells anyone wiring this into an agent
      # that "private-key file contents are never echoed back in a tool's text
      # response", and names this script in parentheses as the regression check
      # for it. A documented security property of an agent-facing surface should
      # not depend on someone remembering to run a script by hand.
      #
      # It needs only python3 (the server shells out to HerraduraCli/herradura.py,
      # which is what this job already exercises), so it belongs here rather than
      # in a job of its own.
      # Both harnesses Mcp/README.md lists under "## Testing". The example is
      # not decorative: it raises on any tool error, so it fails loudly, and it
      # covers the stdio handshake end to end from a client's point of view.
      - name: Mcp — stdio protocol + trust-model regression checks
        run: |
          python3 Mcp/test_server.py
          python3 docs/examples/mcp/hello_herradura_mcp.py

      - name: CliTest — Python CLI
        run: |
          for f in CliTest/test_cred.sh CliTest/test_encfile.sh CliTest/test_encrypt.sh \
                   CliTest/test_encrypted_pem.sh CliTest/test_hybrid_kex.sh CliTest/test_keygen.sh \
                   CliTest/test_oprf.sh CliTest/test_pake.sh CliTest/test_rnl_sp800227_kdf.sh \
                   CliTest/test_sign.sh CliTest/test_signfile.sh CliTest/test_threshold_sign.sh \
                   CliTest/test_vectors.sh CliTest/test_zkp_nl.sh CliTest/test_zkp_rnl.sh; do
            echo "=== $f ==="
            bash "$f"
          done

  native-interop:
    name: C / Go / Python cross-CLI interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # default-jdk-headless is for test_threshold_interop.sh,
      # test_v3_family.sh (TODO #260) and test_zkp_hybrid_family.sh
      # (TODO #261) below: all are Java-optional and degrade to a NOTE
      # without it, but a JDK is cheap here and gets this job's genuine
      # 4-way (not just 3-way) coverage.  For test_zkp_hybrid_family.sh
      # the Java column is the point -- it is the script that exists
      # because those five tags were Java-shaped holes.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev golang-go python3 default-jdk-headless

      - name: Build C
        run: ./build_c.sh

      - name: Build Go
        run: ./build_go.sh

      # TODO #261: this job installed default-jdk-headless and never compiled
      # the bindings, so every Java-optional script here took its
      # HerraduraCli.class check, printed "NOTE: bindings/java not compiled"
      # and skipped the Java column -- for two years of green runs the
      # "genuine 4-way coverage" the comment above claims was 3-way. Building
      # them is the whole cost of making that comment true.
      - name: Build Java bindings
        run: bash bindings/java/build.sh

      - name: CliTest — cross-language interop (C + Go + Python + Java)
        run: |
          for f in CliTest/test_aead.sh CliTest/test_c_interop.sh CliTest/test_go_interop.sh \
                   CliTest/test_cred_interop.sh CliTest/test_oprf_interop.sh CliTest/test_stern_interop.sh \
                   CliTest/test_zkp_interop.sh CliTest/test_hybrid_kex_interop.sh CliTest/test_threshold_interop.sh \
                   CliTest/test_fuzz_interop.sh CliTest/test_kat_vectors.sh CliTest/test_duplex.sh \
                   CliTest/test_rand.sh CliTest/test_ring.sh CliTest/test_stern_kem.sh CliTest/test_wots.sh \
                   CliTest/test_zkbpp.sh CliTest/test_zkp_default_rounds.sh \
                   CliTest/test_kat_pem.sh CliTest/test_fpe_twk.sh \
                   CliTest/test_v3_family.sh CliTest/test_zkp_hybrid_family.sh \
                   CliTest/test_unknown_flags.sh CliTest/test_passphrase_envelope.sh; do
            echo "=== $f ==="
            bash "$f"
          done

      - name: Coverage guard — every non-Java CliTest/*.sh must be claimed by exactly one native-* job
        run: |
          declared="test_c_*.sh test_weak_key_rejection.sh \
                    test_go_*.sh \
                    test_cred.sh test_encfile.sh test_encrypt.sh test_encrypted_pem.sh test_hybrid_kex.sh \
                    test_keygen.sh test_oprf.sh test_pake.sh test_rnl_sp800227_kdf.sh test_sign.sh \
                    test_signfile.sh test_threshold_sign.sh test_vectors.sh test_zkp_nl.sh test_zkp_rnl.sh \
                    test_aead.sh test_c_interop.sh test_go_interop.sh test_cred_interop.sh test_oprf_interop.sh \
                    test_stern_interop.sh test_zkp_interop.sh test_hybrid_kex_interop.sh test_threshold_interop.sh \
                    test_fuzz_interop.sh test_kat_vectors.sh test_duplex.sh test_rand.sh test_ring.sh \
                    test_stern_kem.sh test_wots.sh test_zkbpp.sh test_zkp_default_rounds.sh \
                    test_kat_pem.sh test_fpe_twk.sh test_v3_family.sh \
                    test_zkp_hybrid_family.sh test_unknown_flags.sh \
                    test_passphrase_envelope.sh"
          cd CliTest
          missing=0
          for f in *.sh; do
            case "$f" in test_java_*) continue ;; esac
            case "$f" in test_cross_lang_matrix.sh) continue ;; esac  # claimed by cross-lang-compat (TODO #207)
            case "$f" in test_malformed_pem_matrix.sh) continue ;; esac # claimed by cross-lang-compat (TODO #240)
            case "$f" in test_digest_matrix.sh) continue ;; esac      # claimed by cross-lang-compat (TODO #269)
            case "$f" in test_kdf_matrix.sh) continue ;; esac         # claimed by cross-lang-compat (TODO #269)
            case "$f" in test_param_bounds.sh) continue ;; esac       # claimed by cross-lang-compat (TODO #278)
            case "$f" in test_narrow_width_matrix.sh) continue ;; esac # claimed by cross-lang-compat (TODO #313)
            case "$f" in lib_*.sh) continue ;; esac                   # sourced helpers, not runnable tests (TODO #221)
            claimed=0
            for pattern in $declared; do
              case "$f" in $pattern) claimed=1 ;; esac
            done
            if [ "$claimed" -eq 0 ]; then
              echo "UNCLAIMED: $f is not run by any native-* CI job — update .github/workflows/ci.yml (TODO #205)"
              missing=1
            fi
          done
          exit $missing

      # TODO #287. The guard above is scoped to CliTest/ by construction, which
      # is how Mcp/test_server.py sat unrun: a correctly built, correctly gated
      # harness that no job claimed, in a directory nothing swept. The principle
      # -- a test harness must be claimed by exactly one job -- is not specific
      # to CliTest/, so this extends it to every OTHER directory that holds one.
      #
      # Deliberately a small explicit list rather than a glob over the tree:
      # SecurityProofsCode/ is ~80 analysis scripts of which CI runs two by
      # design (see native-python; the rest are minutes to over an hour), and a
      # blanket sweep there would assert something this repo has decided not to
      # do. What this catches is the case that actually happened -- a NEW
      # harness appearing outside CliTest/ with nothing running it.
      - name: Coverage guard — test harnesses outside CliTest/ must be claimed too
        run: |
          # COMMENTS ARE STRIPPED FIRST, and that is not a detail: the first
          # version of this guard grepped the whole file, and the comment block
          # above -- which names Mcp/test_server.py while explaining the guard --
          # satisfied it. Deleting the run step left it green. A guard that its
          # own rationale can satisfy checks nothing, so only lines that could
          # actually execute a harness are considered.
          sed 's/#.*$//' .github/workflows/ci.yml > /tmp/ci_nocomments.yml
          missing=0
          # TODO #324: RECURSIVE. These were shell globs, so
          # bindings/ffi/test_*.py did not reach
          # bindings/ffi/python/test_ffi_correctness.py -- one directory too
          # shallow -- and benchmarks/test_*.py matched nothing at all. A glob
          # that matches nothing looks exactly like a glob that is satisfied,
          # which is how a harness that FAILED sat unrun for seventeen releases.
          # find(1) also means a harness added in a new subdirectory is caught
          # without anyone remembering to extend a list.
          #
          # TODO #325: PER-PATTERN, and that is the part that does not decay.
          # #324 fixed the DEPTH and left the LANGUAGE -- the patterns were
          # Python-only, so bindings/ffi/go/*_test.go was invisible to the very
          # guard rewritten to catch a harness nobody runs, and those two files
          # HARD-CRASH against the shim #324 fixed. Widening the list to
          # *_test.go alone would leave the next extension equally invisible,
          # which is #314 pass 3's recorded lesson for the third time. So each
          # pattern is checked SEPARATELY and one that matches NOTHING is an
          # ERROR: deleting the last Go harness fails this guard until the
          # pattern goes with it, and adding a fifth extension becomes a
          # decision someone makes rather than one nobody notices.
          #
          # KNOWN LIMIT: this is still a pattern list, so a harness named by
          # none of them is still invisible -- a main() in a file called
          # something else, a shell script outside CliTest/. What it closes is
          # the case that occurred twice: a harness whose NAME says exactly what
          # it is, in a place the pattern could not reach.
          # SecurityProofsCode is a root because the '*_test.py' pattern
          # matched NOTHING without it -- the two files it names live only
          # there -- and #324's combined find() hid that: OR-ing a dead pattern
          # with a live one gives a non-empty result, so the dead half is
          # invisible. That is the same defect one level down, found by the
          # per-pattern rule on its first run. Those two are claimed by a
          # DISCOVERING runner rather than by a step, which is a better
          # mechanism, and the exemption below checks it rather than asserting
          # it.
          roots="Mcp docs/examples bindings benchmarks herradura SecurityProofsCode"
          patterns="test_*.py *_test.py *_test.go"
          harnesses=""
          for pat in $patterns; do
            found=$(find $roots -type f -name "$pat" 2>/dev/null | sort)
            if [ -z "$found" ]; then
              echo "GUARD BROKEN: pattern '$pat' matches nothing under" \
                   "$roots — it used to match something, so either the search" \
                   "is wrong or the last such harness went and the pattern" \
                   "should go with it (TODO #325)"
              missing=1
              continue
            fi
            harnesses="$harnesses $found"
          done
          # The discovered set, read from the runner itself (TODO #289's model).
          # Its EXIT STATUS is checked explicitly rather than left to `bash -e`:
          # a script there that stops gating makes the runner say so and exit 1
          # ("neither gates nor is declared"), which is a sharper detector than
          # the name check below and is the one that actually fires.
          if ! python3 SecurityProofsCode/run_findings_gates.py --list \
                 > /tmp/gates_list.txt 2>&1; then
            echo "GUARD BROKEN: run_findings_gates.py --list failed, so the" \
                 "discovered set cannot be trusted (TODO #325):"
            sed -n '1,20p' /tmp/gates_list.txt
            exit 1
          fi
          if [ -z "$harnesses" ]; then
            echo "GUARD BROKEN: the search found no harnesses at all —" \
                 "it used to find some, so the search itself is wrong (TODO #324)"
            exit 1
          fi
          for f in $harnesses; do
            # Two harnesses are claimed by something other than a step that
            # names them. Both exemptions are CHECKED rather than asserted.
            case "$f" in
              SecurityProofsCode/*)
                # Claimed by discovery, not by a step: run_findings_gates.py
                # finds any script whose exit status is its own verdict, and
                # analysis-findings runs it. Verified against the runner's own
                # listing, so a script that stops being discovered -- the shape
                # #291 found 46 of -- fails here instead of going quiet.
                if ! grep -qF "$(basename "$f")" /tmp/gates_list.txt; then
                  echo "UNCLAIMED: $f is not in run_findings_gates.py's" \
                       "discovered set and no step names it (TODO #325)"
                  missing=1
                fi
                continue ;;
              herradura/codec_fuzz_test.go)
                # Carries only Fuzz* targets, and Fuzz/run_fuzz.sh runs both;
                # the file itself is never spelled in this workflow, so it is
                # claimed by that script rather than by a step. If it grows an
                # ordinary Test function, the fuzz job's -run=xxx excludes it
                # and the claim stops being true -- so that is an error here.
                if grep -qE '^func Test' "$f"; then
                  echo "UNCLAIMED: $f has grown an ordinary Test function," \
                       "which Fuzz/run_fuzz.sh's -run=xxx excludes (TODO #325)"
                  missing=1
                fi
                continue ;;
            esac
            if ! grep -qF "$f" /tmp/ci_nocomments.yml; then
              echo "UNCLAIMED: $f is a test harness that no CI job runs —" \
                   "add it to a job or say in this guard why it is exempt (TODO #287)"
              missing=1
            fi
          done
          exit $missing

      # TODO #329. The guard above matches a harness by FILENAME PATTERN, and #325
      # stated the limit that leaves: "a harness named by none of the patterns
      # stays invisible -- a main() in a file called something else, a shell
      # script outside CliTest/." #326 closed the shell-script half by census;
      # this is the main() half, and it keys on the ENTRY POINT instead, which is
      # the only predicate that reaches a file called hello_herradura.go. 15
      # executables under docs/examples/ and benchmarks/, 11 with no runner, and
      # two five-release breakages inside them -- see the script's header.
      - name: Coverage guard — every executable in docs/examples and benchmarks must be built
        run: python3 tools/check_runnable_coverage.py

      - name: Skip guard — a missing CLI binary must never exit 0
        run: |
          # TODO #229. The compiled CLIs are no longer tracked in git, so the
          # not-built guards in these scripts are live for the first time. Five
          # scripts carried the same copy-pasted block:
          #
          #     echo "SKIP: $bin not built (run build_c.sh / build_go.sh)"; exit 0
          #
          # which reports success from a run that asserted nothing. CI never saw
          # it (every job builds first), so it was a silent local coverage loss.
          # The replacement lives in CliTest/lib_build.sh and exits 2. This guard
          # stops the block from being pasted back in.
          cd CliTest
          missing=0
          for f in *.sh; do
            if grep -qF 'not built (run build_c.sh' "$f"; then
              echo "UNSAFE SKIP: $f exits 0 on a missing CLI binary — use lib_build.sh's" \
                   "hkx_require_built / hkx_require_asserted instead (TODO #229)"
              missing=1
            fi
          done
          exit $missing

      - name: DFR guard — every CliTest script that decapsulates must carry the retry policy
        run: |
          # TODO #221. The QC-MDPC BGF decoder behind hpke-stern-kem (and the KEM
          # half of hybrid-rnl-stern) has a measured ~0.225% decoding failure rate
          # per encapsulation, so any script that decapsulates will go red at that
          # rate unless it retries. TODO #195 established the retry policy but it
          # was applied per-script; test_stern_kem.sh (9 encapsulations, ~2%/run)
          # and test_hybrid_kex.sh went years without it. This guard stops the next
          # one from slipping through.
          cd CliTest
          missing=0
          for f in *.sh; do
            case "$f" in lib_dfr.sh) continue ;; esac
            # EXEMPT, with a reason (TODO #284).  test_kat_pem.sh decapsulates a
            # PINNED ciphertext under a PINNED key -- there is no randomness to
            # retry with, and KAT/generate_pem_kat.py asserts at generation time
            # that the pair decodes.  A retry loop there would be dead code by
            # CONSTRUCTION rather than merely in practice, and worse: if that
            # ciphertext ever stops decoding, that is a decoder regression and
            # never a DFR event, so retrying would mask exactly the signal the
            # vector exists to produce.  An exemption must name a script and say
            # why; do not add one to silence a genuine exposure.
            case "$f" in test_kat_pem.sh) continue ;; esac
            # A script is exposed if it decapsulates: `dec --algo hpke-stern-kem`
            # or a hybrid-rnl-stern completion (the step that takes --our-kem).
            if grep -qE 'dec --algo hpke-stern-kem|--our-kem' "$f"; then
              if ! grep -q 'lib_dfr.sh' "$f"; then
                echo "UNGUARDED: $f decapsulates hpke-stern-kem but does not source lib_dfr.sh (TODO #221)"
                missing=1
              fi
            fi
            # TODO #235 deleted dfr_is_event: implicit rejection means a DFR
            # event no longer produces an error message, so a script grepping
            # for one would treat every DFR event as a hard red — the exact
            # failure this guard exists to prevent. Catch a resurrected copy.
            if grep -q 'dfr_is_event' "$f"; then
              echo "STALE: $f uses dfr_is_event, removed by TODO #235 — retry on an output mismatch via dfr_retryable instead"
              missing=1
            fi
          done
          exit $missing

  native-java:
    name: Java (build + demo + CliTest interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jdk-headless python3

      - name: Build Java
        run: bash bindings/java/build.sh

      # TODO #260 step 5. See the matching C/Go/Python steps: gates on a
      # crash AND a wrong verdict, via the demo's own "[FAIL]"-marker exit
      # code (Demo.java's out() helper, mirroring C's hprintf / Go's
      # stdout-capturing pipe / Python's print shadow, TODO #258/#259).
      - name: Java suite demo runs to completion
        run: java -cp bindings/java herradurakex.Demo

      # TODO #333.  Java's benchmark layer, and the first cost figure this
      # port has ever published.  A SEPARATE step from SelfTest/Demo because
      # the three have different exit conditions -- SelfTest asserts, Demo
      # walks through, and this one publishes a host-specific RATE that
      # nothing asserts on (TODO #292's position).  What makes it admissible
      # in a REQUIRED job at all is [36]'s CONTROL, which does gate the exit
      # status: decap(encap(pk)) must reproduce the key and a uniform
      # syndrome must give a different one, so #235's implicit-rejection path
      # is reached rather than assumed.
      #
      # Reduced caps, as the `docker` job runs docker-entrypoint.sh (TODO
      # #326): -t 0.25 keeps the four rows to about 2 s plus JIT warmup here,
      # where the shipped default is 1.0 s per row.  The caps REACH the rows
      # -- that is #327's whole finding, a batch floor no cap could reduce --
      # and Bench derives its batch from a warm per-call probe, so a reduced
      # -t changes the sample size and not the code path.
      - name: Java benchmarks — [36] deployed QC-MDPC KEM (TODO #333)
        run: java -cp bindings/java herradurakex.Bench -t 0.25

      - name: CliTest — Java bindings + interop
        run: |
          for f in CliTest/test_java_bindings.sh CliTest/test_java_codec.sh \
                   CliTest/test_java_keygen.sh CliTest/test_java_interop.sh \
                   CliTest/test_java_nl_interop.sh CliTest/test_java_stern_interop.sh \
                   CliTest/test_java_oprf_wots_interop.sh CliTest/test_java_hcred_interop.sh \
                   CliTest/test_java_pake_interop.sh; do
            echo "=== $f ==="
            bash "$f"
          done

  # TODO #207: independent of the four native-* build/test jobs above —
  # those prove each language's own suite/CLI passes its own tests; this
  # proves the cryptographic algorithms themselves interoperate correctly
  # *among* all four language CLIs (not just each against Python).
  cross-lang-compat:
    name: 4-language (C/Go/Python/Java) crypto compatibility matrix
    needs: [native-c, native-go, native-python, native-java]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev golang-go python3 default-jdk-headless

      - name: Build C
        run: ./build_c.sh

      - name: Build Go
        run: ./build_go.sh

      - name: Cross-language compatibility matrix
        run: bash CliTest/test_cross_lang_matrix.sh

      # TODO #240: the bounds on the PEM fields that size an allocation are a
      # wire contract, so they belong in the 4-way job rather than any single
      # language's. An artifact one CLI refuses must not be one another accepts.
      - name: Malformed-PEM rejection matrix
        run: bash CliTest/test_malformed_pem_matrix.sh

      # TODO #269: --digest is a 4-way concern for the same reason. The gap it
      # guards (Java had no --digest at all) was invisible to every existing
      # signature test, because those either sign and verify within ONE language
      # or compare PEM bytes -- and a raw-message signature and a digest
      # signature are byte-identical in shape. Only a cross-language pair with
      # the flag set on both sides can see it.
      - name: --digest pre-hash matrix
        run: bash CliTest/test_digest_matrix.sh

      # TODO #269: `kex --kdf`, for two reasons. Java had no --kdf until v6.5.0,
      # and -- the one that is easy to miss -- `--kdf hfscx-256` had never been
      # tested across languages in ANY pair: the only script that mentioned the
      # flag was test_rnl_sp800227_kdf.sh, which is Python-vs-Python by
      # construction because sp800227 exists in no other CLI. C and Go had
      # shipped the flag since before 2.0.0 with nothing asserting their
      # post-hash agreed with Python's. This also covers the VALUE-set axis that
      # spec/'s cli_flag_value_gaps records, which the flag matrix cannot reach.
      - name: kex --kdf matrix
        run: bash CliTest/test_kdf_matrix.sh

      # TODO #278: a bound constant is only worth its value if every path that
      # consumes the parameter applies it. The width axis found XMSS_MAX_H = 20
      # in all four languages and enforcement in two: Python's and Java's own
      # comments call the constant "genpkey's --xmss-height cap", and genpkey
      # was the one path in both that never applied it, so `--xmss-height 32`
      # wrote a ONE-leaf tree labelled h = 32 in Java (`1 << 32` wraps on an
      # int) and never returned in Python. No source-level check can see that --
      # the constant exists, at the same value, everywhere -- so it takes a
      # script that actually runs the four CLIs.
      - name: parameter-bound enforcement matrix
        run: bash CliTest/test_param_bounds.sh

      # TODO #313: what the four CLIs do with an HSKE-NL-A1 key NARROWER than
      # 256 bits. They do four different things, and 16 of the cells exit 0
      # with the wrong plaintext -- A1 is a raw XOR keystream with no tag, so a
      # wrong keystream is not a detectable event. It shipped because nothing
      # anywhere ran the algorithm at a width other than 256: every CliTest
      # invocation feeds from a default-width session key, so a four-way
      # divergence sat under a green 518-assertion cross-language matrix.
      # This script PINS THE KNOWN DEFECT rather than asserting the contract --
      # #313 is still undecided between three routes, and a script asserting
      # the correct contract would be red today and would have to be ignored.
      # Read its header before touching the expectation table.
      - name: narrow-width (n != 256) A1 matrix
        run: bash CliTest/test_narrow_width_matrix.sh

